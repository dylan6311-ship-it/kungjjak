<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쿵짝 · 동네 무대를 발견하고, 다시 찾고, 직접 여는 앱</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#fff; --soft:#F2F4F6; --line:#E5E8EB;
  --ink:#191F28; --sub:#6B7684; --mute:#B0B8C1;
  /* 한바탕 전주 BI 전용색상 세 가지 */
  --pink:#F84264; --red:#A7001F; --magenta:#F81340;
  /* 역할: 핑크는 누를 것·선택된 것, 레드는 작은 글씨(흰 바탕에서 잘 읽힘), 마젠타는 새 소식 표시 */
  --brand:var(--pink); --brand-ink:var(--red); --brand-hot:var(--magenta); --brand-soft:#FEECEF;
  --brand-grad:linear-gradient(135deg,var(--magenta),var(--pink));
  --brand-fill:linear-gradient(90deg,var(--red),var(--pink)); --yellow:#FFC23C; --teal:#2BB39A; --dark:#1C1C22;
  --danger:#E5484D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:var(--ink);background:var(--soft);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}

/* 무대(데스크톱 배치) */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:72px;padding:24px}
/* 시연 4번: 접는 휴대폰을 펼친 화면 하나에 두 앱 (왼쪽 섭외, 오른쪽 협업) */
.pcol{display:flex;flex-direction:column;align-items:center;gap:10px}
.plabel{display:none;width:100%;font-size:14px;font-weight:700;color:var(--sub);align-items:center}
.plabel span{flex:1;text-align:center}
.plabel button{font-size:13px;font-weight:600;color:var(--sub);text-decoration:underline;text-underline-offset:3px;flex:none}
.stage.duo{gap:40px}
.stage.duo .plabel{display:flex}
.phone.fold{width:min(812px,calc(100vw - 48px));height:min(780px,calc(100vh - 82px));display:flex;gap:14px;background:var(--dark);border-radius:44px}
.phone.fold #app,.phone.fold .pane2{flex:1;min-width:0;height:100%;border-radius:30px;overflow:hidden;background:var(--bg);position:relative}
.phone.fold .pane2 iframe{width:100%;height:100%;border:0;display:block}
.phone.fold .hinge{position:absolute;left:50%;top:50%;width:4px;height:44px;margin:-22px 0 0 -2px;border-radius:2px;background:rgba(255,255,255,.5);z-index:2}
@media (max-width:1240px){.stage.duo .aside{display:none}}
.aside{max-width:320px}
.logo{font-weight:900;letter-spacing:-.04em}
.logo b{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.aside .logo{font-size:56px;line-height:1}
.aside h1{font-size:26px;line-height:1.35;margin:28px 0 12px;font-weight:800}
.aside p{color:var(--sub);font-size:15px;line-height:1.6}
.aside .note{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:13px}
.aside .reset{margin-top:14px;font-size:14px;font-weight:600;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.phone{width:390px;height:min(844px,calc(100vh - 48px));flex:none;background:var(--bg);border:10px solid var(--dark);
  border-radius:48px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(25,31,40,.16)}
#app{height:100%;position:relative}
@media (max-width:860px){.aside{display:none}}
@media (max-width:520px){
  .stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}
}

/* 화면 뼈대 */
.screen{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.in-f{animation:inF .28s cubic-bezier(.2,.8,.2,1)}
.in-b{animation:inB .28s cubic-bezier(.2,.8,.2,1)}
@keyframes inF{from{transform:translateX(28px);opacity:0}}
@keyframes inB{from{transform:translateX(-28px);opacity:0}}
.nav{height:52px;flex:none;display:flex;align-items:center;padding:0 8px}
.nav button{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.nav .t{flex:1;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .r{min-width:44px;display:flex;justify-content:flex-end}
.nav .r button{width:auto;padding:0 12px;font-size:15px;font-weight:600;color:var(--sub)}
/* 공유 버튼: 전주 색으로 눈에 띄게 (옅은 핑크 바탕 + 레드 글씨, 대비 약 7:1) */
.nav .r button:disabled{color:var(--mute);cursor:default}
.nav .r button.share{height:34px;margin-right:6px;padding:0 13px 0 10px;border-radius:17px;display:flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand-ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--brand)}
.nav .r button.share svg{width:18px;height:18px;stroke-width:2.2}
.prog{height:3px;background:var(--soft);margin:0 20px;border-radius:3px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--brand-fill);border-radius:3px;transition:width .3s}
.scroll{flex:1;overflow-y:auto;padding:8px 20px 28px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 글자 */
.big{font-size:26px;line-height:1.35;font-weight:800;letter-spacing:-.03em;margin:16px 0 8px}
.lead{color:var(--sub);font-size:15px;line-height:1.55}
.h2{font-size:18px;font-weight:700;margin:32px 0 12px}
.cap{font-size:13px;color:var(--sub);line-height:1.5}
.lbl{font-size:13px;font-weight:700}
.c-brand{color:var(--brand-ink)} .c-teal{color:var(--teal)} .c-yellow{color:#C98A00} .c-dark{color:var(--ink)}

/* 버튼 */
.cta{flex:none;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:var(--bg)}
.cta .cap{text-align:center;margin-bottom:10px}
.cta .two{display:flex;gap:8px}
.cta .two .btn{flex:1;min-width:0}
.btn{width:100%;height:56px;border-radius:16px;background:var(--brand-grad);color:#fff;font-weight:700;font-size:17px;
  text-align:center;transition:transform .12s,opacity .2s}
.btn:active,.row:active,.card:active,.opt:active,.chip:active{transform:scale(.975)}
.btn:disabled{background:var(--line);color:var(--mute);cursor:default}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{width:auto;height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.sm.on{background:var(--soft);color:var(--sub)}

/* 탭바 */
.tabs{flex:none;display:flex;border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 0;position:relative}
.tabs button.on{color:var(--ink)}
.tabs .plus{color:#fff}
.tabs .plus span{width:44px;height:44px;border-radius:16px;background:var(--brand-grad);display:grid;place-items:center}
.dot{position:absolute;top:4px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--brand-hot)}

/* 홈: 위치 + 검색 / 탭 세 개 / 탭마다 묻는 소제목 / 날짜별 목록 */
.top2{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.top2 .hood{margin:0}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.sbar{display:flex;align-items:center;gap:8px;margin-top:12px}
.sbar label{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;background:var(--soft);color:var(--sub)}
.sbar label svg{width:20px;height:20px;flex:none}
.sbar input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;font-weight:500;color:var(--ink)}
.sbar input::placeholder{color:var(--mute)}
.sbar button{flex:none;white-space:nowrap;font-size:15px;font-weight:600;color:var(--sub);padding:0 4px}
.seg{display:flex;gap:22px;margin-top:18px;border-bottom:1px solid var(--line)}
.seg button{position:relative;padding:10px 0 12px;font-size:17px;font-weight:700;color:var(--mute);white-space:nowrap}
.seg button.on{color:var(--ink)}
.seg button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.ask{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.35;margin:22px 0 0}
.fchips{display:flex;gap:8px;margin:14px -20px 0;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;white-space:nowrap;height:34px;padding:0 14px;border-radius:17px;font-size:14px;font-weight:600;color:var(--sub);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:4px}
.fchip.on{background:var(--brand-soft);color:var(--brand-ink);box-shadow:inset 0 0 0 1px var(--brand)}
.fchip svg{width:16px;height:16px}
.kwrow{display:flex;gap:8px;margin-top:10px}.kwrow .inp{height:46px;font-size:15px;font-weight:500;flex:1;min-width:0}.kwrow .btn{flex:none}
.kwchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.kwchips .fchip svg{width:14px;height:14px;margin-left:2px}
.sec{font-size:14px;font-weight:700;color:var(--sub);margin:24px 0 2px}
.ev{display:flex;gap:16px;width:100%;padding:12px 0;align-items:flex-start;text-align:left;transition:transform .12s}
.ev:active{transform:scale(.975)}
.dblock{width:60px;height:68px;border-radius:14px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff}
.dblock b{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.02em}
.dblock b.sm{font-size:15px}
.dblock span{font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
.ev .tx{flex:1;min-width:0;padding-top:2px}
.ev h3{font-size:17px;font-weight:700;line-height:1.35}
.ev p{font-size:14px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev strong{display:block;font-size:15px;font-weight:700;margin-top:3px}
.invite{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:16px;border-radius:16px;background:var(--soft);text-align:left}
.invite .tx{flex:1}.invite b{display:block;font-size:16px}.invite span{font-size:13px;color:var(--sub)}
.picker{display:flex;flex-direction:column;gap:4px}
.picker button{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;font-size:16px;font-weight:600}
.picker button.on{color:var(--brand-ink)}
.picker .pcap{font-size:13px;color:var(--sub);padding:0 4px 4px}
.pcustom{display:flex;align-items:center;gap:8px;padding:2px 0 6px}.pcustom .inp{flex:1;min-width:0;height:50px;font-size:16px;text-align:right;padding:0 12px;font-variant-numeric:tabular-nums}.pcustom .btn{flex:none;height:50px}
.pcustom .sep,.pcustom .won{flex:none;font-size:16px;font-weight:600;color:var(--sub)}
.perr{font-size:13px;font-weight:600;color:var(--danger);padding:0 4px}
/* 홈 (예전 목록 모양: 프로필·내 정보 화면에서 씀) */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:10px}
.top .logo{font-size:22px}
.hood{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:18px 0 4px;display:flex;align-items:center;gap:4px}
.chips{display:flex;gap:8px;margin:18px 0 8px;flex-wrap:wrap}
.chip{height:38px;padding:0 16px;border-radius:19px;background:var(--soft);font-weight:600;font-size:15px;color:var(--sub);transition:transform .12s}
.chip.on{background:var(--ink);color:#fff}
.card{display:flex;gap:16px;width:100%;padding:14px 0;align-items:center;transition:transform .12s}
.thumb{width:76px;height:76px;border-radius:18px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px}
.card h3{font-size:17px;font-weight:700;line-height:1.35;margin:3px 0 4px}
.card .meta{font-size:14px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:56px 0;font-size:15px;line-height:1.6}

/* 상세 */
.poster{margin:0 -20px;aspect-ratio:4/3;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;color:#fff}
.poster .pact{margin-bottom:auto;display:flex;justify-content:flex-end;gap:8px}
.pbtn{height:34px;padding:0 14px;border-radius:17px;display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;cursor:pointer;
  background:color-mix(in srgb,var(--ink) 48%,transparent);color:var(--bg);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pbtn svg{width:17px;height:17px;stroke-width:2.2}
.pbtn:focus-within{outline:2px solid var(--bg);outline-offset:2px}
.ppick{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px;border-radius:16px;background:var(--soft)}
.ppick .ph{width:76px;height:76px;border-radius:14px;flex:none;background:var(--line) center/cover;display:grid;place-items:center;color:var(--mute)}
.ppick .tx{flex:1;min-width:0}.ppick .tx b{display:block;font-size:16px;font-weight:700}.ppick .tx span{font-size:13px;color:var(--sub);line-height:1.45}
.ppick .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ppick .pbtn{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:none;backdrop-filter:none}
.ppick .mini{padding:2px 0}
.poster small{font-weight:700;font-size:14px;opacity:.9}
.poster h1{font-size:30px;line-height:1.25;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.info{margin-top:20px}
.info div{display:flex;padding:11px 0;font-size:16px}
.info dt{width:76px;color:var(--sub);flex:none}
.info dd{font-weight:600;line-height:1.45}
.info .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.info .crumb i{font-style:normal;font-weight:500;color:var(--mute)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;transition:transform .12s}
.ava{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16px;font-weight:700}
.row .tx>span{font-size:14px;color:var(--sub);line-height:1.45;display:block}
.body{font-size:16px;line-height:1.7;color:#333D4B;white-space:pre-line}
.box{background:var(--soft);border-radius:16px;padding:16px 18px;font-size:14px;line-height:1.6;color:var(--sub);margin-top:16px}
.box b{color:var(--ink)}
.sum div{display:flex;justify-content:space-between;padding:10px 0;font-size:16px}
.sum span{color:var(--sub)}
.sum b{font-weight:600;text-align:right}
.sum .total{border-top:1px solid var(--line);margin-top:8px;padding-top:18px;font-size:18px}
.sum .total b{font-weight:800}

/* 입력 */
.field{margin-top:22px}
.field label{display:block;font-size:14px;color:var(--sub);font-weight:600;margin-bottom:8px}
.inp{width:100%;height:56px;border-radius:14px;border:0;background:var(--soft);padding:0 16px;font-size:17px;font-weight:600;outline:2px solid transparent;transition:outline-color .15s}
textarea.inp{height:120px;padding:14px 16px;resize:none;line-height:1.5;font-weight:500}
.inp:focus{outline-color:var(--brand)}
.inp::placeholder{color:var(--mute);font-weight:500}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:16px;background:var(--soft);margin-top:10px;transition:transform .12s;outline:2px solid transparent}
.opt.on{outline-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block;font-size:17px;font-weight:700}
.opt span{font-size:14px;color:var(--sub);line-height:1.45}
.opt .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;flex:none}
.step{display:flex;align-items:center;justify-content:center;gap:28px;margin:48px 0}
.step button{width:52px;height:52px;border-radius:50%;background:var(--soft);font-size:26px;font-weight:600;text-align:center}
.step b{font-size:44px;font-weight:800;min-width:72px;text-align:center}
.chk{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff;flex:none}
.chk.on{background:var(--brand)}
.chk svg{width:16px;height:16px;stroke-width:3}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--brand)}.sw.on::after{transform:translateX(20px)}

/* 완료 */
.done{text-align:center;padding-top:44px}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--brand-grad);color:#fff;display:grid;place-items:center;margin:0 auto 24px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.done .ok svg{width:36px;height:36px;stroke-width:3}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done .big{margin-top:0}

/* 티켓, 섭외 진행, 알림, 현황 */
.ticket{border-radius:24px;background:var(--soft);padding:24px;margin-top:12px}
.qr{width:150px;height:150px;margin:20px auto 4px;display:grid;grid-template-columns:repeat(11,1fr);background:#fff;padding:12px;border-radius:16px}
.qr i{background:var(--ink)}.qr i.o{background:transparent}
.line{display:flex;gap:14px;padding-bottom:22px;position:relative}
.line::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.line:last-child::before{display:none}
.line.on::before{background:var(--brand)}
.line b{font-size:16px;font-weight:700;display:block;color:var(--mute)}
.line.on b,.line.now b{color:var(--ink)}
.line span{font-size:14px;color:var(--sub)}
.noti{display:flex;gap:14px;width:100%;padding:16px 0;align-items:flex-start}
.noti .ava{background:var(--brand-soft);color:var(--brand-ink)}
.noti b{font-size:16px;font-weight:700;line-height:1.4;display:block}
.noti span{font-size:14px;color:var(--sub);line-height:1.5;display:block;margin-top:2px}
.noti.read b{font-weight:500;color:var(--sub)}
.kpi{background:var(--soft);border-radius:20px;padding:20px;margin-top:12px}
.kpi .n{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px}
.kpi .n small{font-size:15px;color:var(--sub);font-weight:600;margin-left:6px}
.bar{height:8px;border-radius:4px;background:#fff;margin:12px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--brand-fill)}
.toast{position:absolute;left:20px;right:20px;bottom:104px;background:rgba(25,31,40,.94);color:#fff;border-radius:14px;padding:15px 18px;
  font-size:15px;font-weight:600;line-height:1.45;text-align:center;animation:up .3s cubic-bezier(.2,.8,.2,1);z-index:9;pointer-events:none}
@keyframes up{from{transform:translateY(14px);opacity:0}}
.sheet{position:absolute;inset:0;background:rgba(25,31,40,.45);display:flex;align-items:flex-end;z-index:10;animation:up .2s}
.sheet-in{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheet-in b{font-size:18px}
.sheet-in textarea.inp{height:96px;font-size:15px}

/* 시연 바로가기 (PC 화면 왼쪽) */

.send button{width:46px;height:46px;border-radius:50%;background:var(--brand-grad);color:#fff;display:grid;place-items:center;flex:none}
</style>
</head>
<body>
<div class="stage">
  <div class="aside">
    <div class="logo">쿵<b>짝</b></div>
    <h1>지방에도 무대는 있다.<br>보이지 않을 뿐.</h1>
    <p>동네 공연·전시·북토크를 발견하고, 다시 찾고, 직접 여는 앱. 오른쪽 화면을 눌러 보세요.</p>
    <p class="note">기획을 설명하기 위한 예시 화면이에요. 게시글과 팀·공간 이름은 모두 가상이고, 실제 결제는 일어나지 않아요.</p>

    <div class="demo">
      <div class="lbl">시연 바로가기</div>
      <button data-a="scene" data-scene="home"><i>1</i>가입을 마친 홈</button>

    </div>
  </div>

</div>

<script>
/* ───────── 데이터 ───────── */
// 페이지 원본: 시연 4번에서 같은 앱을 오른쪽 휴대폰에 한 번 더 띄울 때 써요 (그 화면은 저장 공간을 따로 써요)
const PANE = window.PANE || '';
const PAGE_SRC = PANE ? '' : '<!doctype html>\n' + document.documentElement.outerHTML;
const KEY = 'kungjjak-v2' + (PANE ? '-' + PANE : '');
const HOODS = ['덕진동', '서신동', '효자동', '서학동', '중앙동'];
const GENRES = ['공연', '전시', '북토크', '마켓'];
// 가격 구간: 앞 금액 이상, 뒤 금액 미만. 설문에서 한 번에 낼 수 있는 금액은 1만 원 미만이 가장 많았어요(50%)
const PRICE_RANGES = [{ min: 0, max: 10000, label: '무료~10,000원' }, { min: 10000, max: 20000, label: '10,000~20,000원' }, { min: 20000, max: 30000, label: '20,000~30,000원' }];
const comma = (n) => Number(n).toLocaleString('ko-KR');
// 직접 입력: 두 칸 중 한쪽만 적어도 돼요. 앞 칸만 → 그 금액부터, 뒤 칸만 → 무료부터 그 금액까지. 두 금액 모두 포함해요
function parsePrice(d) {
  if (!d.a && !d.b) return { err: '금액을 한 칸 이상 적어 주세요' };
  const lo = d.a ? num(d.a) : 0, hi = d.b ? num(d.b) : Infinity;
  if (lo > hi) return { err: '앞 칸 금액이 뒤 칸보다 작아야 해요' };
  return { min: lo, max: hi, incl: true, custom: true, label: hi === Infinity ? `${comma(lo)}원부터` : `${lo ? comma(lo) : '무료'}~${comma(hi)}원` };
}
const inPrice = (p, r) => { const v = entryPrice(p); return v >= r.min && (r.incl ? v <= r.max : v < r.max); };
const entryPrice = (p) => (p.price.mode === 'fixed' ? p.price.amount : p.price.mode === 'flex' ? p.price.min : 0);
/* 관심 분야·키워드: 팔로우하지 않은 팀의 글이라도, 고른 장르나 적어 둔 낱말이 맞으면 알려줘요 */
const INT = () => (S.interests = S.interests || { genres: [], keywords: [] });
const KW_MAX = 8;
let kwDraft = '';
function interestHit(p) {
  const it = INT(), hay = [p.title, p.desc, p.mood, p.by, p.venue, p.place, p.hood, p.genre].filter(Boolean).join(' ').toLowerCase();
  const kw = it.keywords.find((k) => hay.includes(k.toLowerCase()));
  if (kw) return { kw };
  if (p.type === 'event' && it.genres.includes(p.genre)) return { genre: p.genre };
  return null;
}
const interestMatches = () => S.posts.filter((p) => shown(p) && !p.mine && interestHit(p));
// 0번은 전주 레드→핑크, 5번은 전주 마젠타→옅은 핑크. 나머지는 행사마다 다른 포스터 색
const GRADS = [['#A7001F','#F84264'],['#1C1C22','#5B5F6B'],['#2BB39A','#E4C94A'],['#FFC23C','#FF7A36'],['#5B6CFF','#9B8CFF'],['#F81340','#FF8FA3']];
const VERIFY = { school: '학교 이메일 인증', insta: '인스타그램 연결', biz: '사업자 확인' };
const NOW = new Date();
const pad = (n) => String(n).padStart(2, '0');
const iso = (d, t) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}${t ? 'T' + t : ''}`;
const plusDays = (n) => { const d = new Date(NOW); d.setDate(d.getDate() + n); return d; };
const nextDow = (dow, weeks = 0) => { const d = new Date(NOW); d.setDate(d.getDate() + (((dow - d.getDay() + 7) % 7) || 7) + weeks * 7); return d; };

function seed() { return fillGal(seedBase()); }
function seedBase() {
  return {
    me: null, hoods: [], seq: 1, tickets: [], follows: [], notifs: [], chats: [], teams: [], reports: [],
    settings: { push: true, kakao: true, weekly: true, follow: true, followCollab: true, followRequest: true },
    // 프로토타입이 없는 객체: '__proto__', 'constructor' 같은 이름도 평범한 키로 다뤄요
    profiles: Object.assign(Object.create(null), {
      '새벽세시': { kind: '아티스트', hood: '덕진동', verify: 'insta', bio: '통기타 두 대로 노래하는 2인조. 전주에서 5년째 무대에 서고 있어요.', reviews: [{ by: '서신동 이웃', text: '작은 공간인데 소리가 꽉 찼어요. 다음 공연도 갈게요.', title: '가을 저녁 라이브' }, { by: '효자동 이웃', text: '처음 들었는데 노래가 계속 맴돌아요.', title: '가을 저녁 라이브' }] },
      '파도소리 밴드': { kind: '아티스트', hood: '덕진동', verify: 'insta', bio: '따라 부르기 좋은 곡을 하는 4인조 밴드.', reviews: [{ by: '덕진동 이웃', text: '동아리 행사에 모셨는데 분위기가 확 살았어요.', title: '동아리 연합 행사' }] },
      '모래내 브라스': { kind: '아티스트', hood: '중앙동', verify: null, bio: '관악 5인조. 거리와 시장에서 자주 연주해요.', reviews: [] },
      '온고을 트리오': { kind: '아티스트', hood: '덕진동', verify: 'insta', bio: '피아노, 베이스, 드럼. 수요일마다 연주해요.', reviews: [] },
      '골목사진모임': { kind: '모임', hood: '서학동', verify: null, bio: '서학동에 사는 사람들이 동네를 찍어요.', reviews: [] },
      '기타 치는 도윤': { kind: '개인', hood: '덕진동', verify: null, bio: '일렉 기타 7년 차. 함께 공연할 밴드를 찾고 있어요.', reviews: [] },
      '필름 찍는 서연': { kind: '개인', hood: '서학동', verify: null, bio: '필름 카메라로 전주 골목을 찍어요.', reviews: [] },
      '시 쓰는 하은': { kind: '개인', hood: '서신동', verify: null, bio: '시를 써요. 낭독 무대에 서 보고 싶어요.', reviews: [] },
      '책방 늘보': { kind: '공간', hood: '서신동', verify: 'biz', bio: '독립출판물을 다루는 동네 책방. 한 달에 두 번 낭독회를 열어요.', reviews: [{ by: '서신동 이웃', text: '작가 목소리로 듣는 글은 다르네요. 조용하고 좋았어요.', title: '가을 낭독회' }] },
      '라이브 펍 소리굴': { kind: '공간', hood: '덕진동', verify: 'biz', bio: '40석 규모의 라이브 펍. 주말마다 무대가 열려요.', reviews: [] },
      '카페 온기': { kind: '공간', hood: '덕진동', verify: 'biz', bio: '대학가 골목의 카페. 저녁에는 작은 공연을 열어요.', reviews: [] },
      '갤러리 골목': { kind: '공간', hood: '서학동', verify: null, bio: '작가가 직접 운영하는 작은 전시 공간.', reviews: [] },
      '온고을대 경영학과 학생회': { kind: '모임', hood: '효자동', verify: 'school', bio: '온고을대 경영학과 학생회예요.', reviews: [] },
      '온고을대 문예창작 동아리': { kind: '모임', hood: '효자동', verify: 'school', bio: '온고을대 문예창작 동아리예요. 한 학기에 한 번 북토크를 열어요.', reviews: [] },
    }),
    posts: [
      { id:'e1', type:'event', genre:'공연', title:'토요일 밤 어쿠스틱 라이브', by:'새벽세시', venue:'라이브 펍 소리굴', hood:'덕진동', at: iso(nextDow(6), '20:00'),

        <div class="h2" style="margin-top:24px">게시물 링크</div><div class="linkbox"><code>${esc(postLink(p))}</code><button class="btn sm" data-a="copyLink" data-id="${id}">링크 복사</button></div><p class="cap" style="margin-top:8px">인스타그램 글 속 주소는 눌리지 않아요. ${story ? '스토리의 링크 스티커에 이 링크를 붙여 넣어 주세요' : '프로필 링크나 스토리 링크 스티커에 붙여 넣어 주세요'}.</p>
        <p class="cap" style="margin-top:12px">휴대폰에서는 공유 창이 열려요. PC에서는 이미지를 내려받으니, 인스타그램에서 ${story ? '스토리' : '새 게시물'}로 올려 주세요. 내려받기가 안 되면 이미지를 길게 누르거나 오른쪽 클릭해 저장하세요.</p>`,
      cta: story ? { label: '인스타그램 스토리로 보내기', a: 'sendInsta', id }
        : { label: '인스타그램으로 보내기', a: 'sendInsta', id, cap: '글은 자동으로 복사돼요. 인스타그램에서 붙여 넣으세요' },
    };
  },

  onboard() {
    if (!flow || flow.k !== 'onboard') flow = { k: 'onboard', i: 0, d: { name: '' }, hoods: [] };
    const n = flow.hoods.length;
    if (flow.i === 0) return {
      body: `<div style="padding-top:36px"><div class="logo" style="font-size:28px">쿵<b>짝</b></div>
        <h1 class="big" style="margin-top:28px">반가워요.<br>뭐라고 부를까요?</h1><p class="lead">후기와 채팅에 이 이름으로 보여요. 팀이나 공간 프로필은 가입한 뒤에 따로 만들 수 있어요.</p>
        <div class="field"><label>이름 또는 별명</label><input class="inp" data-f="name" placeholder="예: 덕진동 고양이" value="${esc(flow.d.name)}" maxlength="12">${warn('name', flow.d.name)}</div></div>`,
      cta: { label: '다음', a: 'flowNext', valid: () => flow.d.name.trim() },
    };
    return {
      nav: true, prog: 1,
      body: `<h1 class="big">어느 동네의 무대가<br>궁금한가요?</h1><p class="lead">여러 곳을 골라도 돼요. 고른 동네의 공연·전시·북토크가 피드에 먼저 보여요.</p><div style="margin-top:20px">${hoodPicker()}</div>`,
      cta: { label: !n ? '동네를 골라 주세요' : n === 1 ? `${flow.hoods[0]}으로 시작하기` : `${n}개 동네로 시작하기`, a: 'start', disabled: !n },
    };
  },

  hoods() {
    if (!flow || flow.k !== 'hoods') flow = { k: 'hoods', hoods: [...S.hoods] };
    return { nav: true, body: `<h1 class="big">내 동네</h1><p class="lead">여러 곳을 골라도 돼요. 고른 동네의 글이 피드에 먼저 보여요.</p><div style="margin-top:20px">${hoodPicker()}</div>`,
      cta: { label: flow.hoods.length ? `${flow.hoods.length}개 동네 저장하기` : '한 곳 이상 골라 주세요', a: 'saveHoods', disabled: !flow.hoods.length } };
  },

  home() {
    const T = HOME_TABS[homeTab], see = homeTab === 'see';
    const chip = (c) => `<button class="fchip ${subs.includes(c) ? 'on' : ''}" data-a="sub" data-c="${c}">${c}</button>`;
    return {
      tab: 'home',
      body: `<div class="top2"><button class="hood" data-a="go" data-n="hoods">${hoodLabel()}${icon('down', 'width:22px;height:22px;color:var(--mute)')}</button>
          ${searchOpen ? '' : `<button class="iconbtn" data-a="searchOpen" aria-label="검색">${icon('search')}</button>`}</div>
        ${searchOpen ? `<div class="sbar"><label>${icon('search')}<input data-s placeholder="${T.search}" value="${esc(q)}" autocomplete="off"></label><button data-a="searchClose">취소</button></div>` : ''}
        <div class="seg">${Object.entries(HOME_TABS).map(([k, v]) => `<button class="${homeTab === k ? 'on' : ''}" data-a="homeTab" data-t="${k}">${v.label}</button>`).join('')}</div>
        <h2 class="ask">${T.ask}</h2>
        ${see ? `<div class="fchips">${chip('이번 주')}${chip('무료')}${chip('인증 팀')}<button class="fchip ${genre ? 'on' : ''}" data-a="genreOpen">${genre || '장르'}${icon('down')}</button><button class="fchip ${price ? 'on' : ''}" data-a="priceOpen">${price ? price.label : '가격'}${icon('down')}</button></div>`
          : (homeTab === 'with' ? `<div class="fchips">${chip(SEEK.team[0])}${chip(SEEK.member[0])}</div>` : '') + (!T.invite ? '' : `<button class="invite" data-a="composeAs" data-t="${T.type}"><div class="tx"><b>${T.invite[0]}</b><span>${T.invite[1]}</span></div>${icon('next', 'width:20px;height:20px;color:var(--mute)')}</button>`)}
        <div id="list">${listHTML()}</div>`,
    };
  },

  event({ id }) {
    const p = post(id), ts = S.tickets.filter((x) => x.postId === id && !x.canceled), open = ts.filter((x) => !x.attended), revs = prof(p.by).reviews;
    const free = p.price.mode === 'donate', seats = open.reduce((n, x) => n + x.qty, 0);
    const mine = ts.length > 1 ? { label: `내 티켓 ${ts.length}장`, a: 'go', n: 'tickets' } : ts.length ? { label: '내 티켓 보기', a: 'ticket', id: ts[0].id } : null;
    return {
      nav: true, right: postRight(p),
      body: `<div class="poster" style="${grad(p)}">${p.mine ? `<div class="pact">${p.photo ? `<button class="pbtn" data-a="photoOff" data-id="${p.id}">사진 빼기</button>` : ''}${photoPicker(p.id, p.photo ? '사진 바꾸기' : '사진 추가')}</div>` : ''}<small>${p.genre} · ${p.hood}</small><h1>${esc(p.title)}</h1></div>${reportedBox(p)}
        <dl class="info">${crumbRow(p)}
        <div><dt>기간</dt><dd>${when(p)}</dd></div><div><dt>장소</dt><dd>${esc(p.venue)}</dd></div>
        <div><dt>입장료</dt><dd>${p.price.mode === 'fixed' ? won(p.price.amount) : p.price.mode === 'flex' ? `${won(p.price.min)}부터, 낼 만큼` : '무료, 끝난 뒤 앱에서 후원'}</dd></div></dl>
        <div class="h2">소개</div><p class="body">${esc(p.desc || '소개가 아직 없어요.')}</p>${galleryHTML(p)}
        <div class="h2">만드는 사람</div>${followRow(p.by, prof(p.by).kind || '팔로우하면 새 무대를 알려드려요')}
        ${p.venue && p.venue !== p.by ? followRow(p.venue, `${p.hood}의 공간`) : ''}
        ${p.mine ? '' : `<button class="btn ghost" style="margin-top:12px" data-a="ask" data-id="${id}">${esc(p.by)}에게 문의하기</button>`}
        ${revs.length ? `<div class="h2">다녀온 사람들의 한마디</div>${revs.slice(0, 2).map(reviewHTML).join('')}<p class="cap" style="margin-top:10px">${esc(p.by)}의 무대를 예매하고 본 사람만 남길 수 있어요.</p>` : ''}
`,
      cta: !ts.length ? { label: free ? '무료로 예약하기' : '예매하기', a: 'book', id }
        : !open.length ? { ...mine, ghost: true }
        : { label: free ? '추가로 예약하기' : '추가 예매하기', a: 'book', id, alt: mine, cap: `이미 ${seats}명 ${free ? '예약' : '예매'}해 뒀어요` },
    };
  },

  book() {
    const p = post(flow.id), steps = flow.steps, s = steps[flow.i], pr = p.price;
    const unit = pr.mode === 'fixed' ? pr.amount : pr.mode === 'flex' ? flow.amount : 0, total = unit * flow.qty;
    let body, cta = { label: '다음', a: 'flowNext' };
    if (s === 'qty') body = `<h1 class="big">몇 명이 가나요?</h1><p class="lead">${esc(p.title)}</p>
      <div class="step"><button data-a="qty" data-d="-1" aria-label="줄이기">−</button><b>${flow.qty}</b><button data-a="qty" data-d="1" aria-label="늘리기">+</button></div>`;
    else if (s === 'amount') {
      const opts = [pr.min, pr.rec, pr.rec + 5000];
      body = `<h1 class="big">한 명에 얼마를 낼까요?</h1><p class="lead">최소 ${won(pr.min)}만 내면 들어갈 수 있어요. ${esc(p.by)}의 권장 금액은 ${won(pr.rec)}이에요.</p>
        <div style="margin-top:16px">${opts.map((o, i) => `<button class="opt ${flow.amount === o && !flow.custom ? 'on' : ''}" data-a="amount" data-v="${o}"><div style="flex:1"><b>${won(o)}</b><span>${['최소 금액', '권장 금액', '조금 더 응원하기'][i]}</span></div>${chk(flow.amount === o && !flow.custom)}</button>`).join('')}</div>
        <div class="field"><label>직접 정하기</label><input class="inp" inputmode="numeric" placeholder="${won(pr.min)} 이상" data-f="custom" value="${flow.custom ? esc(flow.d.custom || '') : ''}"></div>`;
      cta.valid = () => flow.amount >= pr.min;
    } else {
      body = `<h1 class="big">${total ? '이대로 결제할까요?' : '이대로 예약할까요?'}</h1>
        <div class="sum" style="margin-top:20px"><div><span>행사</span><b>${esc(p.title)}</b></div><div><span>일시</span><b>${when(p)}</b></div>
        <div><span>장소</span><b>${esc(p.venue)}</b></div><div><span>인원</span><b>${flow.qty}명</b></div>
        ${total ? `<div><span>결제 수단</span><b>간편결제</b></div>` : ''}
        <div class="total"><span>${total ? '결제 금액' : '입장료'}</span><b>${total ? won(total) : '무료'}</b></div></div>
        ${S.tickets.some((x) => x.postId === p.id && !x.canceled) ? `<p class="cap" style="margin-top:12px">이미 가진 티켓은 그대로 두고, 티켓이 한 장 더 생겨요.</p>` : ''}
        <div class="box">${total ? `<b>낸 돈은 전부 ${esc(p.by)}에게 가요.</b> 쿵짝이 맡아 뒀다가 행사가 끝난 뒤에 전달해요. 쿵짝은 수수료를 받지 않아요.` : '<b>입장은 무료예요.</b> 보고 나서 좋았다면 앱에서 후원할 수 있어요.'}</div>`;
      cta = { label: total ? `${won(total)} 결제하기` : '무료로 예약하기', a: 'pay', cap: total ? '시연용 화면이라 실제 결제는 일어나지 않아요' : '' };
    }
    return { nav: true, prog: (flow.i + 1) / steps.length, body, cta };
  },

  booked({ tid }) {
    const t = S.tickets.find((x) => x.id === tid), p = post(t.postId), sg = suggest(p);
    if (!flow || flow.k !== 'booked') flow = { k: 'booked', picks: sg.map((x) => x.name) };
    return {
      body: `<div class="done"><div class="ok">${icon('check')}</div><h1 class="big">${t.total ? '예매했어요' : '예약했어요'}</h1>
        <p class="lead">${p.at ? `${parts(p.at).day}요일 ${fmtTime(p.at)}, ` : ''}${esc(p.venue)}에서 만나요</p></div>
        ${sg.length ? `<div class="h2" style="margin-top:44px">다음 무대도 놓치지 않게</div>${pickRows(sg)}` : ''}`,
      cta: { label: sg.length && flow.picks.length ? '팔로우하고 마치기' : '마치기', a: 'bookedDone', tid },
    };
  },

  tickets() {
    const row = (t) => { const p = post(t.postId); return `<button class="card" data-a="ticket" data-id="${t.id}"><div class="thumb" style="${grad(p)}">${kind(p)[0]}</div>
      <div><div class="lbl ${t.attended || t.canceled ? '' : 'c-brand'}" style="${t.attended || t.canceled ? 'color:var(--mute)' : ''}">${t.canceled ? (t.total ? '예매 취소' : '예약 취소') : t.attended ? '다녀왔어요' : '예매 완료'}</div><h3>${esc(p.title)}</h3><div class="meta">${when(p)} · ${t.qty}명</div></div></button>`; };
    return { nav: true, title: '내 티켓', body: S.tickets.map(row).join('') || '<div class="empty">아직 예매한 무대가 없어요.<br>홈에서 가까운 무대를 골라 보세요.</div>' };
  },

  ticket({ id }) {
    const t = S.tickets.find((x) => x.id === id), p = post(t.postId), word = t.total ? '예매' : '예약';
    let h = 0; for (const c of t.id + p.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const cells = Array.from({ length: 121 }, (_, i) => { const r = Math.floor(i / 11), c = i % 11; const corner = (r < 3 && c < 3) || (r < 3 && c > 7) || (r > 7 && c < 3); h = (h * 1103515245 + 12345) >>> 0; return `<i class="${corner || (h >> 16) % 2 ? '' : 'o'}"></i>`; }).join('');
    const x = t.canceled;
    return {
      nav: true, title: '티켓',
      body: `<div class="ticket"><div class="lbl ${x ? '' : kindColor(p)}" style="${x ? 'color:var(--mute)' : ''}">${x ? `${word} 취소` : kind(p)}</div><h1 class="big" style="margin:6px 0 2px">${esc(p.title)}</h1><p class="lead">${esc(p.by)}</p>
        ${x ? `<p class="cap" style="text-align:center;padding:28px 0 8px">취소한 ${word}${bat(word) ? '이라' : '라'} 입장할 수 없어요</p>` : `<div class="qr">${cells}</div><p class="cap" style="text-align:center">입구에서 이 화면을 보여주세요</p>`}</div>
        <dl class="info">${crumbRow(p)}<div><dt>기간</dt><dd>${when(p)}</dd></div><div><dt>장소</dt><dd>${esc(p.venue)}</dd></div><div><dt>인원</dt><dd>${t.qty}명</dd></div>
        <div><dt>결제</dt><dd>${t.total ? won(t.total) : '무료'}${t.tip ? ` · 후원 ${won(t.tip)}` : ''}</dd></div>
        ${x ? `<div><dt>환불</dt><dd>${t.total ? `${won(x.refund)} 환불 요청` : '돌려받을 돈 없음'}</dd></div><div><dt>취소 사유</dt><dd>${esc(x.why)}</dd></div>` : ''}</dl>
        ${!x && !t.attended ? `<div style="text-align:center;margin-top:24px"><button class="mini" data-a="cancel" data-id="${t.id}">${word} 취소하기</button></div>` : ''}`,
      cta: x ? { label: `취소한 ${word}${bat(word) ? '이에요' : '예요'}`, disabled: true } : t.attended ? { label: '다녀온 무대예요', disabled: true } : { label: '입장 체크인하기', a: 'checkin', id, cap: '시연용: 행사 당일로 건너뛰어요' },
    };
  },

  cancel() {
    const t = S.tickets.find((x) => x.id === flow.id), p = post(t.postId), free = !t.total, word = free ? '예약' : '예매';
    if (flow.i === 0) return {
      nav: true, prog: 1 / 2,
      body: `<h1 class="big">${word}${eul(word)} 취소하는<br>이유를 알려주세요</h1><p class="lead">${esc(p.title)} · ${t.qty}명</p>
        <div style="margin-top:16px">${CANCEL_WHY.map((w) => `<button class="opt ${flow.why === w ? 'on' : ''}" data-a="cwhy" data-w="${w}"><div style="flex:1"><b style="font-size:16px">${w === '기타' ? '기타 (직접 적기)' : w.replace('예매', word)}</b></div>${chk(flow.why === w)}</button>`).join('')}</div>
        ${flow.why === '기타' ? `<div class="field"><label>취소하는 이유</label><textarea class="inp" style="height:88px" data-f="etc" placeholder="이유를 짧게 적어 주세요" maxlength="80">${esc(flow.d.etc)}</textarea></div>` : ''}`,
      cta: { label: '다음', a: 'flowNext', valid: () => flow.why && (flow.why !== '기타' || flow.d.etc.trim()) },
    };
    return {
      nav: true, prog: 1,
      body: `<h1 class="big">이대로 ${word}${eul(word)}<br>취소할까요?</h1>
        <div class="sum" style="margin-top:20px"><div><span>행사</span><b>${esc(p.title)}</b></div><div><span>일시</span><b>${when(p)}</b></div><div><span>인원</span><b>${t.qty}명</b></div>
        <div><span>취소 사유</span><b>${esc(cancelWhy())}</b></div>
        <div class="total"><span>돌려받을 금액</span><b>${free ? '없음' : won(t.total)}</b></div></div>
        <div class="box">${free ? '<b>무료 예약이라 돌려드릴 돈은 없어요.</b> 취소하면 자리가 다른 이웃에게 돌아가요.' : `<b>낸 돈 ${won(t.total)}을 전부 돌려드려요.</b> 결제한 간편결제로 돌아가요.`} 취소한 ${word}${bat(word) ? '은' : '는'} 되돌릴 수 없어요.</div>`,
      cta: { label: `${word} 취소하기`, a: 'cancelDone', cap: free ? '' : '시연용 화면이라 실제 환불은 일어나지 않아요' },
    };
  },

  after({ tid }) {
    const t = S.tickets.find((x) => x.id === tid), p = post(t.postId), sg = suggest(p), don = p.price.mode === 'donate';
    if (!flow || flow.k !== 'after') flow = { k: 'after', picks: sg.map((x) => x.name), tip: 0, d: { review: '' } };
    return {
      body: `<div style="padding-top:36px"><div class="lbl c-brand">${esc(p.title)}</div><h1 class="big" style="margin-top:8px">오늘 무대, 어땠나요?</h1>
        ${don ? `<p class="lead">좋았다면 ${esc(p.by)}에게 마음을 보내 보세요. 전부 전달돼요.</p>
          <div class="chips">${[0, 3000, 5000, 10000].map((v) => `<button class="chip ${flow.tip === v ? 'on' : ''}" data-a="tip" data-v="${v}">${v ? won(v) : '다음에 할게요'}</button>`).join('')}</div>` : `<p class="lead">오늘의 관심이 다음 무대로 이어지게 도와드릴게요.</p>`}
        <div class="field"><label>한 줄 후기 (선택)</label><textarea class="inp" style="height:88px" data-f="review" placeholder="다음에 올 이웃에게 한마디 남겨 주세요" maxlength="80">${esc(flow.d.review)}</textarea></div>
        ${sg.length ? `<div class="h2">다음 무대 소식 받기</div>${pickRows(sg)}` : `<div class="box"><b>${esc(p.by)}</b>${eul(p.by)} 이미 팔로우하고 있어요. 다음 무대가 잡히면 알려드릴게요.</div>`}</div>`,
      cta: { label: don && flow.tip ? `${won(flow.tip)} 후원하고 마치기` : '마치기', a: 'afterDone', tid, cap: '시연용: 마치면 다음 날 아침으로 건너뛰어요' },
    };
  },

  request({ id }) {

function render(dir) {
  if (lb && !document.querySelector('.lb')) lb = null;

  const top = stack[stack.length - 1], v = V[top.n](top.p || {});

  const tab = (n, ic, t) => `<button class="${v.tab === n ? 'on' : ''}" data-a="tab" data-n="${n}">${icon(ic)}${t}${dots[n] ? '<i class="dot"></i>' : ''}</button>`;

    ${v.prog ? `<div class="prog"><i style="width:${v.prog * 100}%"></i></div>` : ''}${v.pin || ''}
    <main class="scroll">${v.body}</main>
    ${v.sugg && v.sugg.length ? `<div class="sugg">${v.sugg.map((x) => `<button data-a="sugg" data-k="${x.k}">${esc(x.text)}</button>`).join('')}</div>` : ''}
    ${v.send ? `<div class="send"><input id="chatIn" class="inp" placeholder="메시지 보내기" value="${esc(chatDraft)}" autocomplete="off"><button data-a="send" aria-label="보내기">${icon('up')}</button></div>` : ''}
    ${c ? `<div class="cta">${c.cap ? `<p class="cap">${c.cap}</p>` : ''}${c.alt ? `<div class="two"><button class="btn ghost" data-a="${c.alt.a}" ${attrs(c.alt)}>${c.alt.label}</button>` : ''}<button class="btn ${c.ghost ? 'ghost' : ''}" data-cta data-a="${c.a || ''}" ${attrs(c)} ${c.disabled || (curValid && !curValid()) ? 'disabled' : ''}>${c.label}</button>${c.alt ? '</div>' : ''}</div>` : ''}
    ${v.tab ? `<nav class="tabs">${tab('home', 'home', '홈')}${tab('chats', 'chat', '채팅')}<button class="plus" data-a="compose" aria-label="글 올리기"><span>${icon('plus')}</span></button>${tab('notifs', 'bell', '알림')}${tab('my', 'user', '내 정보')}</nav>` : ''}

const go = (n, p) => { stack.push({ n, p }); render('f'); };
const root = (...rest) => { stack = [{ n: 'home' }, ...rest]; };
function build() {
  const d = flow.d, at = d.date && d.time ? `${d.date}T${d.time}` : null, base = { id: 'u' + S.seq + (flow.uid || (flow.uid = Math.random().toString(36).slice(2, 7))), type: flow.type, title: d.title.trim(), by: d.by.trim(), hood: d.hood, mine: true, g: S.seq % GRADS.length, ...(d.gallery && d.gallery.length ? { gallery: d.gallery.map((it) => ({ src: it.src, cap: clean((it.cap || '').trim()) })) } : {}) };
  if (flow.type === 'event') return { ...base, genre: d.genre, venue: d.venue.trim(), at, desc: clean((d.desc || '').trim()), ...(d.photo ? { photo: d.photo } : {}),
    price: d.mode === 'fixed' ? { mode: 'fixed', amount: num(d.amount) } : d.mode === 'flex' ? { mode: 'flex', min: num(d.min), rec: num(d.rec) } : { mode: 'donate' } };
  if (flow.type === 'request') return { ...base, at, place: d.venue.trim(), budget: num(d.budget), mood: clean(d.mood.trim()), status: 'open', responses: [] };
  return { ...base, seek: d.seek, desc: clean(d.desc.trim()), joined: false };
}

  book({ id }) { const pr = post(id).price; flow = { k: 'book', id, i: 0, qty: 1, amount: pr.rec || 0, custom: false, d: {}, steps: ['qty', ...(pr.mode === 'flex' ? ['amount'] : []), 'confirm'] }; go('book'); },

  /* 채팅 */
  chat({ id }) { const c = chatOf(id); if (c && c.unread) { c.unread = false; save(); } flow = null; chatDraft = ''; go('chat', { id }); },
  ask({ id }) { const p = post(id), c = getChat(id, p.by, '문의'); if (!c.msgs.length) scriptInit(c); save(); A.chat({ id: c.id }); },
  talk({ id, by }) {
    const p = post(id), fresh = !S.chats.some((x) => x.postId === id && x.with === by), c = getChat(id, by, p.type === 'request' ? '섭외' : '협업');
    if (fresh && !scriptInit(c)) { const r = (p.responses || []).find((x) => x.by === by); if (r) c.msgs.push({ text: r.msg }); }
    save(); A.chat({ id: c.id });
  },
  send() {
    const top = stack[stack.length - 1], c = chatOf(top.p.id), text = chatDraft.trim(); if (!text) return;
    const shown = clean(text); say(c, shown); chatDraft = '';
    if (scriptOf(c)) { c.msgs.push({ hint: true, text: '데모에서는 아래 추천 답장으로 대화가 이어져요.' }); save(); render(); } // 대본 채팅은 상대가 엉뚱한 답을 하지 않게
    else { save(); render(); reply(c); }
    if (shown !== text) toast('바르지 않은 표현은 *로 가렸어요');
  },
  respond({ id }) { flow = null; go('respond', { id }); },
  sendResponse({ id }) {
    const p = post(id), by = flow.d.by.trim(), msg = clean(flow.d.msg.trim());
    p.responses.push({ by, msg, me: true }); const c = getChat(id, p.by, '섭외'); say(c, `${by}입니다. ${msg}`); save();
    flow = null; stack.pop(); go('chat', { id: c.id }); toast('응답을 보냈어요. 여기서 바로 조율할 수 있어요'); reply(c);
  },
  join({ id }) { const p = post(id); p.joined = true; const c = getChat(id, p.by, '협업'); if (!c.msgs.length && scriptInit(c)) { save(); return go('chat', { id: c.id }); } say(c, '안녕하세요, 함께하고 싶어요.'); save(); go('chat', { id: c.id }); reply(c); },
  choose({ id, by }) { go('hire', { id, by }); },
  hirePay({ id, by }) {
    const p = post(id); p.status = 'paid'; p.chosen = by; save(); stack.pop(); render('b'); toast(`${by}에게 맡겼어요. 공연이 끝나면 전달돼요`);
    const c = S.chats.find((x) => x.postId === id && x.with === by); if (c && scriptOf(c)) scriptAfter(c);
  },
  sugg({ k }) {
    const top = stack[stack.length - 1], c = top.n === 'chat' && chatOf(top.p.id), sc = scriptOf(c); if (!sc || typingChat) return;
    const st = sc.steps(c, post(c.postId))[c.step]; if (!st || !st[k]) return;
    say(c, st[k][0]); chatDraft = '';
    if (k === 'side') { c.used.push(c.step); theyType(c, [{ text: st[k][1] }]); }
    else theyType(c, [{ text: st[k][1] }, ...(st.then || [])], () => { c.step++; });
  },
  agree({ cid }) {
    const c = chatOf(cid), p = post(c.postId), e = post('e2'); if (c.agreed) return;
    c.agreed = true; p.joined = true;
    if (e && !e.desc.includes(JOIN_LINE())) e.desc += JOIN_LINE(); // 단독 공연 소개에 드러머 이름을 더해요
    scriptAfter(c); toast(`${c.with}${wa(c.with)} 함께하기로 했어요`);
  },
  chatReset() {
    const top = stack[stack.length - 1], c = top.n === 'chat' && chatOf(top.p.id);
    if (!scriptOf(c)) return toast('대본이 있는 채팅 화면에서 눌러 주세요');
    const p = post(c.postId);
    if (p && p.chosen === c.with) { p.chosen = undefined; if (p.type === 'request') p.status = 'open'; }
    if (c.agreed) { c.agreed = false; const e = post('e2'); if (e) e.desc = e.desc.replace(JOIN_LINE(), ''); }
    typingChat = null; scriptInit(c); chatDraft = ''; save(); render(); toast('대화를 처음부터 다시 시작해요');
  },
  settle({ id }) { const p = post(id); p.status = 'settled'; notify({ title: `${p.chosen}에게 ${man(p.budget)}이 전달됐어요`, body: `${p.title} · 정산 완료`, to: id }); save(); render(); toast('공연이 끝났어요. 정산을 마쳤어요'); },
  galDel({ i }) { flow.d.gallery.splice(Number(i), 1); render(); },

  lbDel() {

  report({ target, id }) { flow = null; go('report', { target, id }); },

      notify({ title: '섭외 글에 응답 2개가 왔어요', body: p.title, to: p.id });
    }
    // 팔로우한 팀이나 공간이 새 행사를 올리면 팔로워에게 바로 알려요 (알림 설정에서 끌 수 있어요)
    const FOLLOW_KEY = { event: 'follow', collab: 'followCollab', request: 'followRequest' };
    const fans = S.settings[FOLLOW_KEY[p.type]] !== false ? (p.type === 'event' ? [p.by, p.venue] : [p.by]).filter((n, i, a) => n && a.indexOf(n) === i && following(n)) : [];

      const title = p.type === 'event' ? (who === p.by ? `팔로우한 ${who}${ga(who)} 새 ${p.genre}${eul(p.genre)} 올렸어요` : `팔로우한 ${who}에서 새 ${p.genre}${ga(p.genre)} 열려요`)
        : p.type === 'collab' ? `팔로우한 ${who}${ga(who)} ${seekOf(p) === 'member' ? '함께할 팀원을' : '함께할 팀을'} 찾아요`
        : `팔로우한 ${who}${ga(who)} 섭외 요청을 올렸어요`;
      const body = p.type === 'request' ? `${p.title} · 예산 ${man(p.budget)}` : p.at ? `${p.title} · ${when(p)}` : p.title;
      notify({ title, body, to: p.id });
    }
    const hit = fans.length ? null : interestHit(p);
    if (hit) {
      const what = p.type === 'event' ? p.genre : p.type === 'collab' ? '함께하기 글' : '섭외 요청', ga = (w) => (bat(w) ? '이' : '가');
      notify({ title: hit.kw ? `관심 키워드 '${hit.kw}'${bat(hit.kw) ? '이' : '가'} 들어간 새 ${what}${ga(what)} 올라왔어요` : `관심 분야인 ${hit.genre}${ga(hit.genre)} 새로 올라왔어요`,
        body: p.type === 'request' ? `${p.title} · 예산 ${man(p.budget)}` : p.at ? `${p.title} · ${when(p)}` : p.title, to: p.id });
    }
    S.posts.unshift(p); save(); flow = null; filter = '전체'; subs = []; q = ''; genre = ''; price = null; homeTab = { event: 'see', request: 'hire', collab: 'with' }[p.type]; root({ n: p.type, p: { id: p.id } }); render('f');
    toast(masked ? '바르지 않은 표현은 *로 가려서 올렸어요' : hit ? `올렸어요. ${hit.kw ? `'${hit.kw}'${eul(hit.kw)} 관심 키워드로 둔` : `${hit.genre}${eul(hit.genre)} 관심 분야로 고른`} 사람에게 알림을 보냈어요` : fans.length ? `올렸어요. ${p.type === 'request' ? '두 팀이 벌써 응답했고, ' : ''}${fans[0]}${eul(fans[0])} 팔로우한 사람에게 알림을 보냈어요` : p.type === 'request' ? '올렸어요. 벌써 두 팀이 응답했어요' : `올렸어요. ${p.hood} 이웃의 피드에 보여요`);
  },

  openNoti({ id }) { const n = S.notifs.find((x) => x.id === id); n.read = true; save(); if (n.to === 'home' || !post(n.to)) { stack = [{ n: 'home' }]; return render('f'); } go(post(n.to).type, { id: n.to }); },
  toggle({ k }) { S.settings[k] = !S.settings[k]; save(); render(); },
  intGenre({ g }) { const it = INT(), on = it.genres.includes(g); it.genres = on ? it.genres.filter((x) => x !== g) : GENRES.filter((x) => x === g || it.genres.includes(x)); save(); render(); toast(on ? `${g} 관심 분야를 뺐어요` : `새 ${g}${bat(g) ? '이' : '가'} 올라오면 알려드릴게요`); },
  kwAdd() {
    const it = INT(), k = kwDraft.trim().replace(/\s+/g, ' ');
    if (!k) return document.getElementById('kwIn')?.focus();
    if (hasBad(k)) return toast('바르지 않은 표현은 키워드로 쓸 수 없어요');
    if (it.keywords.some((x) => x.toLowerCase() === k.toLowerCase())) return toast('이미 있는 키워드예요');
    if (it.keywords.length >= KW_MAX) return toast(`키워드는 ${KW_MAX}개까지 둘 수 있어요`);
    it.keywords.push(k); kwDraft = ''; save(); render(); document.getElementById('kwIn')?.focus();
    const n = interestMatches().filter((p) => interestHit(p).kw === k).length;
    toast(n ? `'${k}' 키워드를 더했어요. 지금 맞는 글이 ${n}개 있어요` : `'${k}'${bat(k) ? '이' : '가'} 들어간 글이 올라오면 알려드릴게요`);
  },
  kwDel({ i }) { const k = INT().keywords.splice(Number(i), 1)[0]; save(); render(); toast(`'${k}' 키워드를 뺐어요`); },
  reset() { kwDraft = ''; priceDraft = { a: '', b: '' }; duo(false); try { localStorage.removeItem(KEY); } catch (e) {} S = seed(); flow = null; filter = '전체'; subs = []; homeTab = 'see'; genre = ''; price = null; searchOpen = false; q = ''; chatDraft = ''; stack = [{ n: 'onboard' }]; render('f'); },
  scene({ scene }) { if (PANE || !SCENES[scene]) return; A.closeSheet(); duo(scene === 'hire'); SCENES[scene](); save(); render('f'); },
  duoOff() { duo(false); },
};

/* ───────── 시연 바로가기: 발표 중 장면을 바로 불러와요 ───────── */
function demoBase() {
  S = seed(); flow = null; filter = '전체'; subs = []; q = ''; chatDraft = ''; homeTab = 'see'; genre = ''; price = null; searchOpen = false;
  S.me = { name: '덕진동 고양이' }; S.hoods = ['덕진동', '서신동'];
  notify({ title: `이번 주 ${hoodLabel()} 가까이에서 무대 ${S.posts.filter((p) => p.type === 'event').length}개가 열려요`, body: '공연, 전시, 북토크를 모아 봤어요', to: 'home' });
}
// 시연용 가상 포스터 (새벽세시 토요일 공연). 제목은 앱이 포스터 위에 얹으니 그림만 그려요
function demoPoster() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1530"/><stop offset="1" stop-color="#3A1A2E"/></linearGradient></defs>`
    + `<rect width="600" height="800" fill="url(#g)"/><circle cx="420" cy="230" r="150" fill="#F84264" opacity=".85"/><circle cx="420" cy="230" r="64" fill="#1B1530"/>`
    + `<circle cx="150" cy="330" r="46" fill="#F84264" opacity=".35"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const SCENES = {
  home() { demoBase(); stack = [{ n: 'home' }]; },
  book() { demoBase(); stack = [{ n: 'home' }, { n: 'event', p: { id: 'e1' } }]; },
  next() {
    demoBase();
    S.tickets.unshift({ id: 't' + S.seq++, postId: 'e1', qty: 1, total: 10000, attended: true, tip: 0 });
    S.follows = ['새벽세시', '라이브 펍 소리굴'];
    const n = post('e2'); notify({ title: '어제 본 새벽세시의 다음 무대가 잡혔어요', body: `${n.title} · ${when(n)}`, to: 'e2' });
    stack = [{ n: 'notifs' }];
  },
  hire() {
    demoBase();
    const r = post('r1'); r.mine = true; S.teams.push(r.by);
    stack = [{ n: 'home' }, { n: 'request', p: { id: 'r1' } }];
  },
  dash() { if (!S.me) demoBase(); flow = null; stack = [{ n: 'my' }, { n: 'dash' }]; },
  // 발표 시연 ①: 새벽세시가 토요일 공연을 직접 올려요. 같은 공연(e1)은 숨기고, 내용을 미리 채운 글쓰기에서 시작해요
  post() {
    demoBase(); const e = post('e1'); S.posts = S.posts.filter((p) => p.id !== 'e1'); S.teams = ['새벽세시'];
    flow = { k: 'compose', type: 'event', i: 0, direct: true, d: { genre: '공연', title: e.title, by: '새벽세시', venue: e.venue, hood: e.hood, date: e.at.slice(0, 10), time: e.at.slice(11, 16),
      mode: 'fixed', amount: '10000', min: '', rec: '', budget: '', mood: '', desc: e.desc, seek: '', photo: demoPoster() } };
    stack = [{ n: 'home' }, { n: 'compose' }];
  },
  // 발표 시연 ②: 같은 앱을 이웃(하은)의 휴대폰으로 넘겨요. 방금 올린 공연은 그대로 두고 홈으로 가요
  viewer() {
    flow = null; S.teams = []; S.posts.forEach((p) => { if (p.type === 'event') p.mine = false; });
    homeTab = 'see'; filter = '전체'; subs = []; q = ''; genre = ''; price = null; stack = [{ n: 'home' }];
  },
  collab() {
    demoBase(); homeTab = 'with'; S.me = { name: '하람' }; // 밴드에 들어가고 싶은 드러머(가상)
    stack = [{ n: 'home' }, { n: 'collab', p: { id: 'c3' } }];
  },
};

function duo(on) {
  const stage = $('.stage'), ph = stage.querySelector('.phone');
  stage.classList.toggle('duo', on); ph.classList.toggle('fold', on);
  ph.querySelectorAll('.hinge,.pane2').forEach((x) => x.remove());
  if (!on) return;
  stage.querySelector('.plabel').innerHTML = '<span>왼쪽 · 섭외 과정 예시</span><span>오른쪽 · 협업 과정 예시</span><button data-a="duoOff">이전 화면으로</button>';
  ph.insertAdjacentHTML('beforeend', '<i class="hinge"></i><div class="pane2"><iframe title="협업 과정 예시"></iframe></div>');
  ph.querySelector('iframe').srcdoc = PAGE_SRC.replace('<head>', '<head><script>window.PANE = "collab";<\/script>');
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; const f = A[el.dataset.a]; if (!f) return;
  if (!S.me && !PANE && ['book', 'ask', 'respond', 'join', 'talk', 'follow', 'report', 'compose', 'tab', 'go', 'choose'].includes(el.dataset.a) && stack[0].n === 'onboard' && stack.length > 1) {
    linkPending = stack[stack.length - 1]; flow = null; stack = [{ n: 'onboard' }]; render('f'); return toast('먼저 이름과 동네를 알려 주세요. 끝나면 이 글로 돌아와요');
  }
  f({ ...el.dataset });
});
document.addEventListener('keydown', (e) => {
  if (lb) { if (e.key === 'Escape') { e.preventDefault(); return A.lbClose(); } if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); return A.lbGo({ d: e.key === 'ArrowLeft' ? -1 : 1 }); } }
  if (e.target.id === 'chatIn' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); A.send(); return; }
  if (e.target.id === 'kwIn' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); return A.kwAdd(); }
  if ((e.target.id === 'priceA' || e.target.id === 'priceB') && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); return A.priceApply(); }
  if (PANE || /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  const scene = ['home', 'book', 'next', 'hire', 'dash'][Number(e.key) - 1]; if (scene) A.scene({ scene });
});
document.addEventListener('change', async (e) => {
  const gal = e.target.dataset && e.target.dataset.gal;
  if (gal) { const fs = [...(e.target.files || [])]; e.target.value = ''; if (fs.length) addGallery(fs, gal); return; }
  const el = e.target, to = el.dataset && el.dataset.photo; if (!to) return;
  const file = el.files && el.files[0]; el.value = ''; if (!file) return;
  let url; try { url = await shrinkPhoto(file); } catch (err) { return toast('이 파일은 사진으로 열 수 없어요. JPG나 PNG 사진을 골라 주세요'); }
  if (to === 'new') { if (flow && flow.k === 'compose') { flow.d.photo = url; render(); } return; }
  const p = post(to); if (!p) return;
  const had = !!p.photo; p.photo = url; shareImg = null; render();
  toast(save() ? (had ? '사진을 바꿨어요' : '사진을 넣었어요. 피드에도 이 사진이 보여요') : '사진이 커서 이 브라우저에 저장하지 못했어요. 새로고침하면 사라져요');
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'chatIn') { chatDraft = el.value; return; }
  if (el.id === 'kwIn') { kwDraft = el.value; return; }
  if (el.id === 'priceA' || el.id === 'priceB') {
    const d = el.value.replace(/\D/g, '').slice(0, 9), v = d ? comma(Number(d)) : '';
    if (v !== el.value) { el.value = v; el.setSelectionRange(v.length, v.length); }
    priceDraft[el.id === 'priceA' ? 'a' : 'b'] = v; document.querySelector('.perr')?.remove(); return;
  }
  if (el.dataset.gcap !== undefined) { const it = flow && flow.d.gallery && flow.d.gallery[Number(el.dataset.gcap)]; if (it) it.cap = el.value; return; }
  if (el.dataset.s !== undefined) { q = el.value; $('#list').innerHTML = listHTML(); return; }
  const f = el.dataset.f; if (!f || !flow) return;
  flow.d[f] = el.value;
  const w = document.querySelector(`[data-warn="${f}"]`); if (w) w.hidden = !hasBad(el.value);
  if (flow.k === 'book' && f === 'custom') { flow.custom = !!el.value; flow.amount = num(el.value); document.querySelectorAll('.opt').forEach((o) => { o.classList.remove('on'); o.querySelector('.chk')?.classList.remove('on'); }); }
  if (flow.k === 'team' && f === 'name') { const h = $('#dupHint'); if (h) h.style.display = hasProf(el.value.trim()) ? '' : 'none'; }
  const b = $('[data-cta]'); if (b && curValid) b.disabled = !curValid();
});
/* ───────── 발표 슬라이드(발표.html) 안에 띄웠을 때만: 슬라이드가 보낸 시연 단계를 그대로 눌러요 ─────────
   앱만 따로 열면 이 부분은 아무 일도 하지 않아요. */
if (!PANE && window.parent !== window) {
  window.addEventListener('message', (e) => {
    const m = e.data; if (!m || m.kj !== 'demo') return;
    const done = (x) => e.source && e.source.postMessage({ kj: 'demo-done', id: m.id, ...x }, '*');
    if (m.scene) { A.scene({ scene: m.scene }); duo(false); return done({}); }
    // 단계마다 화면 상태를 받아 두었다가, 한 단계 뒤로 갈 때 그대로 되돌려요
    if (m.snap) return done({ snap: JSON.stringify({ S, stack, flow, filter, subs, q, homeTab, genre, searchOpen }) });
    if (m.restore) {
      ({ S, stack, flow, filter, subs, q, homeTab, genre, searchOpen } = JSON.parse(m.restore));
      typingChat = null; chatDraft = ''; lb = null; save(); render('b'); return done({});
    }
    const el = [...document.querySelectorAll('#app ' + m.sel)].find((x) => !m.text || x.textContent.includes(m.text));
    if (!el) return done({ miss: true });
    el.scrollIntoView({ block: m.look ? 'center' : 'nearest' }); // 바로 옮겨야 표시할 자리를 정확히 잴 수 있어요
    setTimeout(() => {
      const r = el.getBoundingClientRect(); done({ rect: [r.left, r.top, r.width, r.height] });
      if (!m.look) setTimeout(() => el.click(), m.fast ? 0 : 320);
    }, m.fast ? 0 : 260);
  });
  // 시연 중에 앱을 눌러도 → ← 키로 슬라이드를 넘길 수 있게 슬라이드에 전해요
  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' '].includes(e.key)) { e.preventDefault(); e.stopImmediatePropagation(); parent.postMessage({ kj: 'key', key: e.key }, '*'); }
  }, true);
}
if (PANE === 'collab') { SCENES.collab(); save(); } // 오른쪽 휴대폰: 책방이 올린 협업 글에서 시작
render();
if (!PANE) { openFromLink(); window.addEventListener('hashchange', openFromLink); }
</script>

# index.html 이 main 에 올라오면 Colab 공유용 노트북을 다시 만들어 커밋한다.
# 누가 어디서(GitHub 웹, 다른 도구) 고쳐도 Colab 링크가 최신이 되게 하는 안전장치.
name: 노트북 동기화

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/sync_notebook.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-notebook
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 노트북을 index.html 기준으로 갱신
        run: python3 scripts/sync_notebook.py

      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet; then
            echo "노트북이 이미 최신입니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "쿵짝_프로토타입.ipynb"
          git commit -m "노트북을 index.html 기준으로 자동 동기화"
          git pull --rebase origin main
          git push
